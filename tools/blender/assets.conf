# Asset registry for the Blender -> Godot unit pipeline.
#
# One line per asset, pipe-separated. reingest.sh reads this so re-exporting a
# changed sculpt is a single command instead of remembering flags. Add a line
# here when you add a unit; nothing else needs to know about it.
#
# name | source .blend (absolute) | output .glb (repo-relative) | height | faces | extra flags
#
# height      the unit's TRUE design height in metres (1 world unit = 1 m; cells are
#             2.0). A model wider than its cell overhangs it and stays one tile
#             (CONQUEST.md "Size"). Rows built before that rule pin the old
#             fit-in-a-cell clamp with "--max-footprint 1.9" so a rebuild never
#             silently changes them; the in-game size of those is set by the
#             roster model_scale instead.
# faces       decimation target; the result lands near 2x this in TRIANGLES
# extra flags OPTIONAL. Any further prepare_unit.py flags for this asset, e.g.
#             "--thorns 40". Keep per-asset options HERE rather than in a one-off
#             command: anything not recorded in this file is silently lost the next
#             time the asset is rebuilt.

